<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Moderator | APIVerve Tutorial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #ee5a24 0%, #d63031 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #ee5a24;
    }

    .mask-selector {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .mask-selector input {
      padding: 10px 14px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      width: 80px;
      text-align: center;
    }

    .mask-selector span {
      color: #666;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #ee5a24 0%, #d63031 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(238, 90, 36, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result h3 {
      color: #333;
      margin-bottom: 12px;
    }

    .result-text {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }

    .stat {
      padding: 12px 20px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    .stat.clean {
      border-color: #00b894;
      background: #e8f8f5;
    }

    .stat.flagged {
      border-color: #d63031;
      background: #ffeaea;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }

    .words-found {
      margin-top: 16px;
    }

    .words-found span {
      display: inline-block;
      padding: 4px 12px;
      background: #ffeaea;
      color: #d63031;
      border-radius: 20px;
      font-size: 14px;
      margin: 4px 4px 4px 0;
    }

    .error {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      color: #c53030;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Content Moderator</h1>
    <p class="subtitle">Filter profanity from user-generated content</p>

    <div class="input-group">
      <label for="input-text">Text to Moderate</label>
      <textarea id="input-text" rows="5" placeholder="Enter text to check for profanity..."></textarea>
    </div>

    <div class="input-group">
      <label>Mask Character</label>
      <div class="mask-selector">
        <input type="text" id="mask-char" value="*" maxlength="1">
        <span>Character used to replace profanity</span>
      </div>
    </div>

    <button id="moderate-btn" onclick="moderate()">Check Content</button>

    <div id="error" class="error" style="display: none;"></div>

    <div id="result" class="result">
      <h3>Filtered Result</h3>
      <div id="result-text" class="result-text"></div>

      <div class="stats">
        <div id="status-stat" class="stat">
          <div class="stat-label">Status</div>
          <div id="status-value" class="stat-value">-</div>
        </div>
        <div class="stat">
          <div class="stat-label">Words Found</div>
          <div id="count-value" class="stat-value">0</div>
        </div>
      </div>

      <div id="words-found" class="words-found" style="display: none;">
        <label>Flagged Words:</label>
        <div id="words-list"></div>
      </div>
    </div>
  </div>

  <script>
    async function moderate() {
      const text = document.getElementById('input-text').value.trim();
      const mask = document.getElementById('mask-char').value || '*';
      const btn = document.getElementById('moderate-btn');
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');

      if (!text) {
        showError('Please enter some text to moderate.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Checking...';
      errorEl.style.display = 'none';
      resultEl.classList.remove('show');

      try {
        const response = await fetch('/api/moderate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, mask })
        });

        const data = await response.json();

        if (data.error) {
          showError(data.error);
        } else {
          showResult(data);
        }
      } catch (err) {
        showError('Failed to connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check Content';
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function showResult(data) {
      document.getElementById('result-text').textContent = data.filtered;
      document.getElementById('count-value').textContent = data.profaneWords;

      const statusStat = document.getElementById('status-stat');
      const statusValue = document.getElementById('status-value');

      if (data.isProfane) {
        statusStat.className = 'stat flagged';
        statusValue.textContent = 'Flagged';
      } else {
        statusStat.className = 'stat clean';
        statusValue.textContent = 'Clean';
      }

      // Hide words list since API returns count only
      document.getElementById('words-found').style.display = 'none';

      document.getElementById('result').classList.add('show');
    }
  </script>
</body>
</html>
